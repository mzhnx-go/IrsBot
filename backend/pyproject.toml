[project]
name = "app"
version = "0.1.0"
description = ""
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi[standard]>=0.115.0,<1.0.0",
    "python-multipart<1.0.0,>=0.0.27",
    "tenacity<10.0.0,>=8.2.3",
    "pydantic>2.0",
    "jinja2<4.0.0,>=3.1.4",
    "alembic<2.0.0,>=1.12.1",
    "httpx>=0.28.0,<1.0.0",
    "psycopg[binary]>=3.1.13,<4.0.0",
    "sqlalchemy>=2.0.25,<3.0.0",
    "sqlmodel>=0.0.22,<1.0.0",
    "pydantic-settings>=2.2.1,<3.0.0",
    "sentry-sdk[fastapi]>=2.0.0,<3.0.0",
    "pyjwt>=2.8.0,<3.0.0",
    "pwdlib[argon2,bcrypt]>=0.3.0",
    "cryptography>=44.0.0",
    "docx2txt>=0.9",
]

[project.optional-dependencies]
langchain = [
    "langchain>=0.3.0,<0.4.0",
    "langchain-openai>=0.2.0,<0.3.0",
    "langchain-anthropic>=0.2.0,<0.3.0",
    "langchain-google-genai>=2.0.0,<3.0.0",
    "langchain-community>=0.3.0,<0.4.0",
    "langgraph>=0.2.0,<0.3.0",
    "langchain-text-splitters>=0.3.0,<0.4.0",
    "langchain-core>=0.3.0,<0.4.0",
    "langchain-milvus>=0.2.0,<0.3.0",
]
rag = [
    "pymilvus>=2.5.7,<2.6.0",
    "pypdf>=5.0.0",
    "beautifulsoup4>=4.12.0",
    "python-magic>=0.4.0",
    "tiktoken>=0.7.0",
    "rank-bm25>=0.2.2",
]
mcp = [
    "mcp>=1.0.0,<2.0.0",
    "aiohttp>=3.9.0,<4.0.0",
]
all = [
    "langchain>=0.3.0,<0.4.0",
    "langchain-openai>=0.2.0,<0.3.0",
    "langchain-anthropic>=0.2.0,<0.3.0",
    "langchain-google-genai>=2.0.0,<3.0.0",
    "langchain-community>=0.3.0,<0.4.0",
    "langgraph>=0.2.0,<0.3.0",
    "langchain-text-splitters>=0.3.0,<0.4.0",
    "langchain-core>=0.3.0,<0.4.0",
    "langchain-milvus>=0.2.0,<0.3.0",
    "pymilvus>=2.5.7,<2.6.0",
    "pypdf>=5.0.0",
    "beautifulsoup4>=4.12.0",
    "python-magic>=0.4.0",
    "tiktoken>=0.7.0",
    "rank-bm25>=0.2.2",
    "mcp>=1.0.0,<2.0.0",
    "aiohttp>=3.9.0,<4.0.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4.3,<8.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.8.0",
    "ruff>=0.2.2,<1.0.0",
    "pre-commit>=3.5.0",
    "coverage>=7.4.3,<8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
markers = [
    "integration: 真实 API 集成测试（需要网络和 API Key）",
]

[tool.mypy]
strict = true
exclude = ["venv", ".venv", "alembic"]

[tool.ruff]
target-version = "py312"
exclude = ["alembic"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG001", # unused arguments in functions
    "T201",   # print statements are not allowed
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "W191",  # indentation contains tabs
    "B904",  # Allow raising exceptions without from e, for HTTPException
]

[tool.ruff.lint.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`.
keep-runtime-typing = true

[tool.coverage.run]
source = ["app"]
dynamic_context = "test_function"

[tool.coverage.report]
show_missing = true
sort = "-Cover"

[tool.coverage.html]
show_contexts = true

[tool.ty.terminal]
error-on-warning = true
